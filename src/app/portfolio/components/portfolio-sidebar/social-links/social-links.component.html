<div class="social-links">
  @for (link of socialLinks; track link.name) {
  <a [href]="link.url" target="_blank" class="social-link" [attr.aria-label]="link.name">
    <div class="social-link-content">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path [attr.d]="link.icon" />
      </svg>
      <span class="social-link-name">{{ link.name }}</span>
    </div>
  </a>
  }
</div>
